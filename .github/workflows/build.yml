name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 22

      # .npmrc sets ignore-scripts, so no dependency runs code at install.
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Docker build
        run: docker build -t giftdraw:ci .

      # Base updates and the weekly rebuild ship without review, so the image
      # has to start and answer, not just build. Proxy auth needs no secrets.
      - name: Smoke test image
        run: |
          docker run -d --name giftdraw-ci \
            -e APP_URL=http://localhost:3000 \
            -e ADMIN_AUTH=proxy -e TRUSTED_PROXIES=127.0.0.1 \
            giftdraw:ci
          for _ in $(seq 30); do
            if docker exec giftdraw-ci wget -qO- http://127.0.0.1:3000/health 2>/dev/null; then
              ok=1; break
            fi
            sleep 1
          done
          docker logs giftdraw-ci
          [ "${ok:-}" = 1 ] || { echo "Image did not answer on /health"; exit 1; }
          # The package managers are removed in the Dockerfile; a base image
          # that adds another one in a new place should fail here.
          if docker exec giftdraw-ci sh -c 'command -v npm || command -v npx || command -v yarn || command -v corepack'; then
            echo "A package manager is still in the image"; exit 1
          fi
