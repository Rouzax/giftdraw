name: Dependabot auto-merge

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  automerge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Reads Dependabot's PR metadata only. The PR's code is never checked
      # out here, so nothing from the update runs with a write token.
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # Only npm minor/patch updates qualify. Majors can break the app;
      # Actions updates run in the privileged release workflow; Docker base
      # images change the runtime. Those all stay manual.
      # --auto waits for the ruleset's required checks before merging.
      - name: Enable auto-merge
        if: >-
          steps.meta.outputs.package-ecosystem == 'npm_and_yarn' &&
          (steps.meta.outputs.update-type == 'version-update:semver-minor' ||
           steps.meta.outputs.update-type == 'version-update:semver-patch')
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
